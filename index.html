<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小猫吃数字</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "微软雅黑", "PingFang SC", "Segoe UI", sans-serif;
    color: #fff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #container {
    position: relative;
    display: inline-block;
    line-height: 0;
  }
  canvas {
    display: block;
    background: #05050f;
    max-width: 100vw;
    max-height: 100vh;
    box-shadow: 0 0 40px rgba(120, 120, 255, 0.2);
    touch-action: none;
  }
  #nameInput {
    position: absolute;
    left: 50%;
    top: 47%;
    transform: translate(-50%, -50%);
    width: 220px;
    padding: 10px 12px;
    background: rgba(20, 20, 40, 0.9);
    border: 2px solid #ffd966;
    border-radius: 6px;
    color: #fff;
    font-size: 18px;
    text-align: center;
    outline: none;
    font-family: inherit;
    display: none;
  }
  #nameInput:focus {
    border-color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 217, 102, 0.6);
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="game" width="960" height="600"></canvas>
  <input id="nameInput" type="text" maxlength="10" placeholder="输入名字...">
</div>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const nameInput = document.getElementById('nameInput');

const STATE = { START: 'start', PLAYING: 'playing', OVER: 'over' };
const MODE = { NUMBER: 'number', MATH: 'math' };

const CAT_RADIUS = 24;
const PLANET_RADIUS = 28;
const CAT_ACCEL = 0.45;
const CAT_FRICTION = 0.94;
const CAT_MAX_SPEED = 6.5;
const HUD_HEIGHT = 60;
const TIGER_DURATION = 8;
const TIGER_BONUS = 3;

const game = {
  state: STATE.START,
  mode: MODE.NUMBER,
  selectedMode: MODE.NUMBER,
  cat: null,
  planets: [],
  particles: [],
  stars: [],
  // number-mode
  nextTarget: 1,
  // math-mode
  equation: null,
  // shared
  wrongCount: 0,
  score: 0,
  highScore: 0,
  leaderboard: [],
  spawnTimer: 0,
  watchdogTimer: 0,
  deathReason: '',
  shake: 0,
  startPulse: 0,
  scoreSaved: false,
  tigerTime: 0, // seconds remaining of tiger mode
};

const LEADERBOARD_KEYS = {
  [MODE.NUMBER]: 'kittyScores_number',
  [MODE.MATH]: 'kittyScores_math',
};

// ===== Audio (Web Audio API procedural sounds) =====
const audio = {
  ctx: null,
  muted: false,
  ensure() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      } catch (e) {}
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  play(type) {
    this.ensure();
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    switch (type) {
      case 'eatCorrect':
        this._seq(t, [{f: 523, d: 0.06}, {f: 659, d: 0.06}, {f: 784, d: 0.10}], 'sine', 0.25); break;
      case 'eatWrong':
        this._seq(t, [{f: 220, d: 0.08}, {f: 150, d: 0.14}], 'square', 0.20); break;
      case 'dangerHit':
        this._seq(t, [{f: 180, d: 0.12}, {f: 100, d: 0.20}, {f: 70, d: 0.30}], 'sawtooth', 0.28); break;
      case 'mushroom':
        this._seq(t, [{f: 523, d: 0.05}, {f: 659, d: 0.05}, {f: 784, d: 0.05}, {f: 1047, d: 0.10}], 'triangle', 0.22); break;
      case 'tigerEat':
        this._seq(t, [{f: 220, d: 0.08}, {f: 110, d: 0.16}], 'sawtooth', 0.30); break;
      case 'gameOver':
        this._seq(t, [{f: 392, d: 0.16}, {f: 311, d: 0.16}, {f: 247, d: 0.32}], 'sine', 0.28); break;
      case 'click':
        this._seq(t, [{f: 700, d: 0.04}], 'square', 0.12); break;
      case 'select':
        this._seq(t, [{f: 600, d: 0.04}, {f: 900, d: 0.05}], 'triangle', 0.15); break;
      case 'start':
        this._seq(t, [{f: 392, d: 0.08}, {f: 523, d: 0.08}, {f: 784, d: 0.14}], 'triangle', 0.22); break;
    }
  },
  _seq(startTime, notes, waveType, vol) {
    let t = startTime;
    const c = this.ctx;
    for (const n of notes) {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = waveType;
      osc.frequency.setValueAtTime(n.f, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, t + n.d);
      osc.connect(gain).connect(c.destination);
      osc.start(t);
      osc.stop(t + n.d + 0.02);
      t += n.d * 0.8;
    }
  },
  toggle() {
    this.muted = !this.muted;
    try { localStorage.setItem('kittyMuted', this.muted ? '1' : '0'); } catch (e) {}
    if (!this.muted) this.play('click');
  },
  loadPref() {
    try { this.muted = localStorage.getItem('kittyMuted') === '1'; } catch (e) {}
  },
};

// ===== Mouse =====
const mouse = {
  x: W / 2,
  y: H / 2,
  inCanvas: false,
  active: false, // true when mouse should drive the cat
  lastMoveTime: 0,
  pointerId: null,
};

function initStars() {
  game.stars = [];
  for (let i = 0; i < 200; i++) {
    game.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.4 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.5,
    });
  }
}

function loadLeaderboard(mode) {
  try {
    const data = localStorage.getItem(LEADERBOARD_KEYS[mode]);
    if (data) {
      const parsed = JSON.parse(data);
      if (Array.isArray(parsed)) {
        game.leaderboard = parsed.filter(e => e && typeof e.score === 'number');
      } else {
        game.leaderboard = [];
      }
    } else {
      game.leaderboard = [];
    }
  } catch (e) {
    game.leaderboard = [];
  }
  game.highScore = game.leaderboard[0] ? game.leaderboard[0].score : 0;
}

function saveLeaderboard(mode) {
  try {
    localStorage.setItem(LEADERBOARD_KEYS[mode], JSON.stringify(game.leaderboard));
  } catch (e) {}
}

function addScore(name, score) {
  game.leaderboard.push({
    name: (name || '').trim() || '无名小猫',
    score: score,
    date: Date.now(),
  });
  game.leaderboard.sort((a, b) => b.score - a.score);
  game.leaderboard = game.leaderboard.slice(0, 10);
  game.highScore = game.leaderboard[0].score;
  saveLeaderboard(game.mode);
  game.scoreSaved = true;
}

// ===== Input =====
const keys = {};
const ARROW_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','a','A','s','S','d','D'];

window.addEventListener('keydown', (e) => {
  audio.ensure(); // first user gesture unlocks audio
  if (document.activeElement === nameInput) return;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
    e.preventDefault();
  }
  keys[e.key] = true;

  // Pressing a movement key takes control back from the mouse
  if (game.state === STATE.PLAYING && ARROW_KEYS.includes(e.key)) {
    mouse.active = false;
  }

  if (e.key === 'm' || e.key === 'M') {
    audio.toggle();
    return;
  }

  if (game.state === STATE.START) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Tab') {
      game.selectedMode = game.selectedMode === MODE.NUMBER ? MODE.MATH : MODE.NUMBER;
      loadLeaderboard(game.selectedMode);
      audio.play('select');
    } else if (e.key === '1') {
      game.selectedMode = MODE.NUMBER;
      loadLeaderboard(game.selectedMode);
      audio.play('select');
    } else if (e.key === '2') {
      game.selectedMode = MODE.MATH;
      loadLeaderboard(game.selectedMode);
      audio.play('select');
    } else if (e.key === ' ' || e.key === 'Enter') {
      audio.play('start');
      startGame(game.selectedMode);
    }
  } else if (game.state === STATE.OVER) {
    if (e.key === ' ') {
      if (!game.scoreSaved) {
        addScore(nameInput.value, game.score);
      }
      nameInput.style.display = 'none';
      game.state = STATE.START;
      loadLeaderboard(game.selectedMode);
      audio.play('click');
    }
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

// Convert browser mouse coords → canvas internal coords
function toCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height),
  };
}

canvas.addEventListener('mousemove', (e) => {
  const c = toCanvasCoords(e.clientX, e.clientY);
  mouse.x = c.x;
  mouse.y = c.y;
  mouse.inCanvas = true;
  mouse.active = true;
  mouse.lastMoveTime = performance.now();
});
canvas.addEventListener('mouseenter', () => { mouse.inCanvas = true; });
canvas.addEventListener('mouseleave', () => { mouse.inCanvas = false; });

function updatePointerControl(e) {
  const c = toCanvasCoords(e.clientX, e.clientY);
  mouse.x = c.x;
  mouse.y = c.y;
  mouse.inCanvas = true;
  mouse.active = true;
  mouse.lastMoveTime = performance.now();
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  e.preventDefault();
  audio.ensure();
  mouse.pointerId = e.pointerId;
  updatePointerControl(e);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  if (mouse.pointerId !== e.pointerId) return;
  e.preventDefault();
  updatePointerControl(e);
});

function stopPointerControl(e) {
  if (mouse.pointerId !== e.pointerId) return;
  mouse.pointerId = null;
  mouse.inCanvas = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
}

canvas.addEventListener('pointerup', stopPointerControl);
canvas.addEventListener('pointercancel', stopPointerControl);

canvas.addEventListener('click', (e) => {
  audio.ensure();
  const c = toCanvasCoords(e.clientX, e.clientY);

  if (game.state === STATE.START) {
    // mode selection cards: cardW=200, cardH=90, gap=30, cardY=155
    const cardW = 200, cardH = 90, gap = 30;
    const startX = (W - (cardW * 2 + gap)) / 2;
    const cardY = 155;
    if (c.y >= cardY && c.y <= cardY + cardH) {
      if (c.x >= startX && c.x <= startX + cardW) {
        if (game.selectedMode === MODE.NUMBER) {
          audio.play('start');
          startGame(MODE.NUMBER);
        } else {
          game.selectedMode = MODE.NUMBER;
          loadLeaderboard(MODE.NUMBER);
          audio.play('select');
        }
        return;
      }
      if (c.x >= startX + cardW + gap && c.x <= startX + cardW * 2 + gap) {
        if (game.selectedMode === MODE.MATH) {
          audio.play('start');
          startGame(MODE.MATH);
        } else {
          game.selectedMode = MODE.MATH;
          loadLeaderboard(MODE.MATH);
          audio.play('select');
        }
        return;
      }
    }
    audio.play('start');
    startGame(game.selectedMode);
  } else if (game.state === STATE.OVER) {
    // Don't hijack clicks meant for the name input (input is on top, this rarely fires)
    if (document.activeElement === nameInput) return;
    if (!game.scoreSaved) addScore(nameInput.value, game.score);
    nameInput.style.display = 'none';
    game.state = STATE.START;
    loadLeaderboard(game.selectedMode);
    audio.play('click');
  }
});

nameInput.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!game.scoreSaved) {
      addScore(nameInput.value, game.score);
    }
    nameInput.style.display = 'none';
    nameInput.blur();
  }
});

// ===== Game lifecycle =====
function startGame(mode) {
  game.state = STATE.PLAYING;
  game.mode = mode;
  game.cat = { x: W/2, y: H/2, vx: 0, vy: 0, scale: 1, shake: 0 };
  game.planets = [];
  game.particles = [];
  game.nextTarget = 1;
  game.equation = null;
  game.wrongCount = 0;
  game.score = 0;
  game.spawnTimer = 0;
  game.watchdogTimer = 0;
  game.deathReason = '';
  game.shake = 0;
  game.scoreSaved = false;
  game.tigerTime = 0;
  nameInput.style.display = 'none';
  nameInput.value = '';
  loadLeaderboard(mode);
  if (mode === MODE.MATH) {
    game.equation = generateEquation(0);
    // spawn answer immediately so player has a target
    spawnPlanetOfValue(game.equation.answer);
  }
}

function endGame(reason) {
  game.state = STATE.OVER;
  game.deathReason = reason;
  game.scoreSaved = false;
  if (game.score > 0) {
    nameInput.value = '';
    nameInput.style.display = 'block';
    setTimeout(() => nameInput.focus(), 50);
  } else {
    game.scoreSaved = true;
  }
}

// ===== Difficulty =====
function difficulty() {
  const N = (game.mode === MODE.NUMBER) ? game.nextTarget : game.score + 1;
  return {
    spawnInterval: Math.max(0.4, 1.5 - N * 0.04),
    driftSpeed: Math.min(2.0, 0.3 + N * 0.05),
    maxPlanets: Math.min(8, 3 + Math.floor(N / 5)),
    dangerRatio: Math.min(0.4, 0.1 + N * 0.012),
    mushroomChance: 0.05,
  };
}

// ===== Math equations =====
function generateEquation(score) {
  // Progressive operator unlock
  let ops;
  if (score < 3) ops = ['+'];
  else if (score < 6) ops = ['+', '-'];
  else if (score < 10) ops = ['+', '-', '×'];
  else ops = ['+', '-', '×', '÷'];

  const op = ops[Math.floor(Math.random() * ops.length)];
  let a, b, answer;

  if (op === '+') {
    const max = score < 3 ? 9 : (score < 8 ? 15 : 30);
    a = 1 + Math.floor(Math.random() * max);
    b = 1 + Math.floor(Math.random() * max);
    answer = a + b;
  } else if (op === '-') {
    const max = score < 8 ? 15 : 30;
    a = 2 + Math.floor(Math.random() * (max - 1));
    b = 1 + Math.floor(Math.random() * a);
    answer = a - b;
  } else if (op === '×') {
    const max = score < 15 ? 9 : 12;
    a = 2 + Math.floor(Math.random() * (max - 1));
    b = 2 + Math.floor(Math.random() * (max - 1));
    answer = a * b;
  } else { // ÷
    b = 2 + Math.floor(Math.random() * 8); // 2-9
    const quotient = 2 + Math.floor(Math.random() * 8); // 2-9
    a = b * quotient;
    answer = quotient;
  }

  return { a, op, b, answer, text: `${a} ${op} ${b} = ?` };
}

function nextEquation() {
  game.equation = generateEquation(game.score);
  // Ensure answer planet exists
  if (!game.planets.some(p => p.type === 'number' && p.value === game.equation.answer)) {
    spawnPlanetOfValue(game.equation.answer);
  }
}

// ===== Spawning =====
function spawnFromEdge() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = Math.random() * W; y = HUD_HEIGHT + PLANET_RADIUS; }
  else if (edge === 1) { x = W - PLANET_RADIUS; y = HUD_HEIGHT + Math.random() * (H - HUD_HEIGHT - PLANET_RADIUS * 2); }
  else if (edge === 2) { x = Math.random() * W; y = H - PLANET_RADIUS; }
  else { x = PLANET_RADIUS; y = HUD_HEIGHT + Math.random() * (H - HUD_HEIGHT - PLANET_RADIUS * 2); }
  return { x, y };
}

function makePlanet(type, value, speedScale) {
  const d = difficulty();
  const pos = spawnFromEdge();
  const angle = Math.random() * Math.PI * 2;
  const speed = d.driftSpeed * (speedScale || (0.5 + Math.random() * 0.8));
  return {
    type, value,
    x: pos.x, y: pos.y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    scale: 0,
    alive: true,
  };
}

function spawnPlanetOfValue(value) {
  game.planets.push(makePlanet('number', value, 0.7));
}

function pickNumberValue() {
  if (game.mode === MODE.NUMBER) {
    const offset = Math.floor(Math.random() * 5) - 1;
    return Math.max(1, game.nextTarget + offset);
  } else {
    const ans = game.equation.answer;
    const range = Math.max(3, Math.floor(ans * 0.4) + 2);
    const offset = Math.floor(Math.random() * (range * 2 + 1)) - range;
    return Math.max(0, ans + offset);
  }
}

function correctValue() {
  return game.mode === MODE.NUMBER ? game.nextTarget : game.equation.answer;
}

function spawnPlanet() {
  const d = difficulty();
  if (game.planets.length >= d.maxPlanets + 3) return;

  const hasMushroom = game.planets.some(p => p.type === 'mushroom');
  const roll = Math.random();
  let type, value = null;

  if (!hasMushroom && roll < d.mushroomChance) {
    type = 'mushroom';
  } else if (roll < d.mushroomChance + d.dangerRatio) {
    type = Math.random() < 0.5 ? 'skull' : 'bone';
  } else {
    const numberPlanets = game.planets.filter(p => p.type === 'number').length;
    if (numberPlanets >= d.maxPlanets) return;
    type = 'number';
    value = pickNumberValue();
    if (game.planets.some(p => p.type === 'number' && p.value === value)) {
      for (let i = 0; i < 5; i++) {
        const alt = pickNumberValue();
        if (!game.planets.some(p => p.type === 'number' && p.value === alt)) {
          value = alt;
          break;
        }
      }
      if (game.planets.some(p => p.type === 'number' && p.value === value)) return;
    }
  }

  game.planets.push(makePlanet(type, value));
}

function ensureAnswerExists() {
  const target = correctValue();
  if (!game.planets.some(p => p.type === 'number' && p.value === target)) {
    spawnPlanetOfValue(target);
  }
}

// ===== Cat update =====
function updateCat(dt) {
  const cat = game.cat;
  const kbLeft  = keys['ArrowLeft']  || keys['a'] || keys['A'];
  const kbRight = keys['ArrowRight'] || keys['d'] || keys['D'];
  const kbUp    = keys['ArrowUp']    || keys['w'] || keys['W'];
  const kbDown  = keys['ArrowDown']  || keys['s'] || keys['S'];
  const kbActive = kbLeft || kbRight || kbUp || kbDown;

  if (kbLeft)  cat.vx -= CAT_ACCEL;
  if (kbRight) cat.vx += CAT_ACCEL;
  if (kbUp)    cat.vy -= CAT_ACCEL;
  if (kbDown)  cat.vy += CAT_ACCEL;

  // Mouse-follow: only when no keyboard input is active. Inertia preserved
  // because we just add acceleration toward the cursor; friction still applies.
  if (!kbActive && mouse.active && mouse.inCanvas) {
    const dx = mouse.x - cat.x;
    const dy = mouse.y - cat.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 6) {
      // Scale acceleration smoothly so the cat slows as it nears the cursor
      const reach = Math.min(1, dist / 80);
      cat.vx += (dx / dist) * CAT_ACCEL * reach;
      cat.vy += (dy / dist) * CAT_ACCEL * reach;
    }
  }

  cat.vx *= CAT_FRICTION;
  cat.vy *= CAT_FRICTION;

  const speed = Math.hypot(cat.vx, cat.vy);
  const maxSpeed = game.tigerTime > 0 ? CAT_MAX_SPEED * 1.15 : CAT_MAX_SPEED;
  if (speed > maxSpeed) {
    cat.vx = cat.vx / speed * maxSpeed;
    cat.vy = cat.vy / speed * maxSpeed;
  }

  cat.x += cat.vx;
  cat.y += cat.vy;

  if (cat.x < CAT_RADIUS) { cat.x = CAT_RADIUS; cat.vx *= -0.5; }
  if (cat.x > W - CAT_RADIUS) { cat.x = W - CAT_RADIUS; cat.vx *= -0.5; }
  if (cat.y < HUD_HEIGHT + CAT_RADIUS) { cat.y = HUD_HEIGHT + CAT_RADIUS; cat.vy *= -0.5; }
  if (cat.y > H - CAT_RADIUS) { cat.y = H - CAT_RADIUS; cat.vy *= -0.5; }

  cat.scale += (1 - cat.scale) * 0.15;
  cat.shake *= 0.85;

  if (game.tigerTime > 0) {
    game.tigerTime = Math.max(0, game.tigerTime - dt);
  }
}

function planetColor(n) {
  const hue = (n * 137.5) % 360;
  return `hsl(${hue}, 70%, 55%)`;
}

function updatePlanets() {
  for (const p of game.planets) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < PLANET_RADIUS && p.vx < 0) p.vx *= -1;
    if (p.x > W - PLANET_RADIUS && p.vx > 0) p.vx *= -1;
    if (p.y < HUD_HEIGHT + PLANET_RADIUS && p.vy < 0) p.vy *= -1;
    if (p.y > H - PLANET_RADIUS && p.vy > 0) p.vy *= -1;
    p.scale += (1 - p.scale) * 0.15;
  }
  game.planets = game.planets.filter(p => p.alive);
}

function explodeParticles(x, y, color, count) {
  count = count || 18;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
    const speed = 2 + Math.random() * 4;
    game.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color,
    });
  }
}

function updateParticles() {
  for (const p of game.particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.life -= 0.035;
  }
  game.particles = game.particles.filter(p => p.life > 0);
}

// ===== Collisions =====
function checkCollisions() {
  const cat = game.cat;
  const isTiger = game.tigerTime > 0;
  for (const p of game.planets) {
    if (!p.alive) continue;
    const dx = cat.x - p.x;
    const dy = cat.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < CAT_RADIUS + PLANET_RADIUS - 6) {
      if (p.type === 'skull' || p.type === 'bone') {
        if (isTiger) {
          // Tiger devours danger
          explodeParticles(p.x, p.y, p.type === 'skull' ? '#ff8866' : '#ffffff', 22);
          p.alive = false;
          game.score += TIGER_BONUS;
          cat.scale = 1.4;
          audio.play('tigerEat');
        } else {
          explodeParticles(p.x, p.y, p.type === 'skull' ? '#ff4444' : '#dddddd');
          game.shake = 20;
          audio.play('dangerHit');
          audio.play('gameOver');
          endGame(p.type === 'skull' ? '撞到骷髅了 💀' : '撞到骨头了 🦴');
          return;
        }
      } else if (p.type === 'mushroom') {
        explodeParticles(p.x, p.y, '#ff66aa', 24);
        p.alive = false;
        game.tigerTime = TIGER_DURATION;
        cat.scale = 1.6;
        audio.play('mushroom');
      } else if (p.type === 'number') {
        const target = correctValue();
        if (p.value === target) {
          if (game.mode === MODE.NUMBER) {
            game.score = p.value;
            game.nextTarget = p.value + 1;
          } else {
            game.score += 1;
            nextEquation();
          }
          p.alive = false;
          cat.scale = 1.5;
          explodeParticles(p.x, p.y, planetColor(p.value));
          audio.play('eatCorrect');
        } else {
          const safeDist = dist > 0.01 ? dist : 1;
          const nx = dx / safeDist;
          const ny = dy / safeDist;
          cat.vx += nx * 9;
          cat.vy += ny * 9;
          p.vx -= nx * 1.8;
          p.vy -= ny * 1.8;
          cat.shake = 12;
          game.shake = 8;
          game.wrongCount++;
          const overlap = (CAT_RADIUS + PLANET_RADIUS - 6) - dist + 2;
          if (overlap > 0) {
            cat.x += nx * overlap;
            cat.y += ny * overlap;
          }
          audio.play('eatWrong');
          if (game.wrongCount >= 3) {
            audio.play('gameOver');
            endGame(game.mode === MODE.NUMBER ? '顺序错太多次 ❌' : '答错太多次 ❌');
            return;
          }
        }
      }
    }
  }
}

// ===== Drawing =====
function drawStars() {
  for (const s of game.stars) {
    s.phase += 0.02 * s.speed;
    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(s.phase));
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, HUD_HEIGHT);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.fillRect(0, HUD_HEIGHT - 1, W, 1);

  ctx.textBaseline = 'middle';

  if (game.mode === MODE.NUMBER) {
    ctx.font = 'bold 22px "微软雅黑", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd966';
    ctx.fillText(`下一个: ${game.nextTarget}`, 20, HUD_HEIGHT / 2);
  } else {
    ctx.font = 'bold 28px "微软雅黑", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd966';
    ctx.fillText(game.equation ? game.equation.text : '', 20, HUD_HEIGHT / 2);
  }

  ctx.font = 'bold 20px "微软雅黑", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = game.wrongCount >= 2 ? '#ff6666' : '#ffffff';
  ctx.fillText(`错误: ${game.wrongCount}/3`, 380, HUD_HEIGHT / 2);

  ctx.fillStyle = '#88ff88';
  ctx.fillText(`得分: ${game.score}`, 540, HUD_HEIGHT / 2);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#aaaaaa';
  ctx.fillText(`最高: ${game.highScore}`, W - 60, HUD_HEIGHT / 2);

  // Mute icon (top-right)
  ctx.font = '20px sans-serif';
  ctx.fillStyle = audio.muted ? '#888888' : '#ffffff';
  ctx.fillText(audio.muted ? '🔇' : '🔊', W - 20, HUD_HEIGHT / 2);

  // Tiger timer bar
  if (game.tigerTime > 0) {
    const barW = 200;
    const barH = 8;
    const barX = W / 2 - barW / 2;
    const barY = HUD_HEIGHT + 8;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
    ctx.fillStyle = '#552200';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ff8833';
    ctx.fillRect(barX, barY, barW * (game.tigerTime / TIGER_DURATION), barH);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 14px "微软雅黑", sans-serif';
    ctx.fillStyle = '#ffaa55';
    ctx.fillText(`🐯 老虎模式 ${game.tigerTime.toFixed(1)}s`, W / 2, barY + barH + 4);
  }
}

function drawPlanets() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const target = (game.state === STATE.PLAYING) ? correctValue() : null;
  for (const p of game.planets) {
    const r = PLANET_RADIUS * Math.max(0, p.scale);
    if (p.type === 'number') {
      const color = planetColor(p.value);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
      // Highlight ring: only in NUMBER mode (math mode should make you compute)
      if (game.mode === MODE.NUMBER && p.value === target) {
        ctx.strokeStyle = '#ffff66';
        ctx.lineWidth = 3 + Math.sin(Date.now() * 0.008) * 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = '#ffffff';
      const fontSize = Math.floor(r * 0.95);
      ctx.font = `bold ${fontSize}px "微软雅黑", sans-serif`;
      ctx.fillText(p.value.toString(), p.x, p.y + 1);
    } else if (p.type === 'mushroom') {
      // Glowing pink halo
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.006);
      ctx.fillStyle = `rgba(255, 102, 170, ${0.3 + 0.3 * pulse})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 8 + pulse * 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = `${Math.floor(r * 1.9)}px sans-serif`;
      ctx.fillText('🍄', p.x, p.y);
    } else {
      const emoji = p.type === 'skull' ? '💀' : '🦴';
      ctx.font = `${Math.floor(r * 1.9)}px sans-serif`;
      ctx.fillText(emoji, p.x, p.y);
    }
  }
}

function drawCat() {
  if (!game.cat) return;
  const cat = game.cat;
  ctx.save();
  const sx = (Math.random() - 0.5) * cat.shake;
  const sy = (Math.random() - 0.5) * cat.shake;
  ctx.translate(cat.x + sx, cat.y + sy);
  ctx.scale(cat.scale, cat.scale);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (game.tigerTime > 0) {
    // Orange aura
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.012);
    const alpha = Math.min(1, game.tigerTime / 1.5); // fade out in last 1.5s
    ctx.fillStyle = `rgba(255, 136, 51, ${0.4 * pulse * alpha})`;
    ctx.beginPath();
    ctx.arc(0, 0, 38, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 200, 100, ${0.3 * pulse * alpha})`;
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = '52px sans-serif';
    // Blink in last 2 seconds
    if (game.tigerTime > 2 || Math.floor(game.tigerTime * 6) % 2 === 0) {
      ctx.fillText('🐯', 0, 2);
    } else {
      ctx.fillText('😺', 0, 2);
    }
  } else {
    ctx.font = '48px sans-serif';
    ctx.fillText('😺', 0, 2);
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of game.particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawModeCard(x, y, w, h, label, sub, selected) {
  ctx.fillStyle = selected ? 'rgba(255, 217, 102, 0.18)' : 'rgba(255, 255, 255, 0.05)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = selected ? '#ffd966' : 'rgba(255,255,255,0.25)';
  ctx.lineWidth = selected ? 3 : 1.5;
  ctx.strokeRect(x, y, w, h);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 28px "微软雅黑", sans-serif';
  ctx.fillStyle = selected ? '#ffffff' : '#cccccc';
  ctx.fillText(label, x + w/2, y + h/2 - 12);
  ctx.font = '14px "微软雅黑", sans-serif';
  ctx.fillStyle = selected ? '#ffd966' : '#888888';
  ctx.fillText(sub, x + w/2, y + h/2 + 18);
}

function drawStartScreen() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 56px "微软雅黑", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('🐱 小猫吃数字', W / 2, 80);

  ctx.font = '16px "微软雅黑", sans-serif';
  ctx.fillStyle = '#aaaaaa';
  ctx.fillText('避开 💀🦴   遇到 🍄 变身老虎吃掉它们', W / 2, 120);

  // Mode selection cards
  const cardW = 200, cardH = 90;
  const gap = 30;
  const totalW = cardW * 2 + gap;
  const startX = (W - totalW) / 2;
  const cardY = 155;
  drawModeCard(startX, cardY, cardW, cardH, '数字模式', '1 → 2 → 3 ...', game.selectedMode === MODE.NUMBER);
  drawModeCard(startX + cardW + gap, cardY, cardW, cardH, '数学模式', '加减乘除', game.selectedMode === MODE.MATH);

  ctx.font = '14px "微软雅黑", sans-serif';
  ctx.fillStyle = '#888888';
  ctx.fillText('← → 切换模式   也可按 1 / 2 直接选', W / 2, cardY + cardH + 20);

  game.startPulse += 0.06;
  const pulse = 0.55 + 0.45 * Math.sin(game.startPulse);
  ctx.font = 'bold 28px "微软雅黑", sans-serif';
  ctx.fillStyle = `rgba(255, 220, 100, ${pulse})`;
  ctx.fillText('按 空格键 开始', W / 2, cardY + cardH + 55);

  // Leaderboard for selected mode
  const modeLabel = game.selectedMode === MODE.NUMBER ? '数字模式' : '数学模式';
  ctx.font = 'bold 22px "微软雅黑", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(`🏆 排行榜 · ${modeLabel}`, W / 2, 365);

  if (game.leaderboard.length === 0) {
    ctx.font = '16px "微软雅黑", sans-serif';
    ctx.fillStyle = '#666666';
    ctx.fillText('还没有记录，快来当第一名！', W / 2, 405);
  } else {
    ctx.font = '17px monospace';
    const startY = 400;
    const lineH = 22;
    const leftX = W / 2 - 150;
    const rightX = W / 2 + 150;
    const rows = Math.min(7, game.leaderboard.length);
    for (let i = 0; i < rows; i++) {
      const entry = game.leaderboard[i];
      const y = startY + i * lineH;
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
      ctx.fillStyle = i < 3 ? '#ffd966' : '#dddddd';
      ctx.textAlign = 'left';
      ctx.fillText(`${medal}  ${entry.name}`, leftX, y);
      ctx.textAlign = 'right';
      ctx.fillText(entry.score.toString(), rightX, y);
    }
  }

  ctx.textAlign = 'center';
  ctx.font = '13px "微软雅黑", sans-serif';
  ctx.fillStyle = '#666666';
  ctx.fillText('方向键 ←↑→↓ / WASD / 鼠标移动控制小猫    M 键静音', W / 2, H - 20);

  // Mute indicator on start screen too
  ctx.textAlign = 'right';
  ctx.font = '20px sans-serif';
  ctx.fillStyle = audio.muted ? '#888888' : '#ffffff';
  ctx.fillText(audio.muted ? '🔇' : '🔊', W - 20, 30);
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 52px "微软雅黑", sans-serif';
  ctx.fillStyle = '#ff6666';
  ctx.fillText('游戏结束', W / 2, 80);

  const modeLabel = game.mode === MODE.NUMBER ? '数字模式' : '数学模式';
  ctx.font = '18px "微软雅黑", sans-serif';
  ctx.fillStyle = '#aaaaaa';
  ctx.fillText(`${modeLabel}   ${game.deathReason}`, W / 2, 125);

  ctx.font = 'bold 36px "微软雅黑", sans-serif';
  ctx.fillStyle = '#ffd966';
  ctx.fillText(`本局得分: ${game.score}`, W / 2, 175);

  if (!game.scoreSaved) {
    ctx.font = '16px "微软雅黑", sans-serif';
    ctx.fillStyle = '#aaaaaa';
    ctx.fillText('输入名字，按 Enter 保存', W / 2, 220);
  } else {
    ctx.font = '18px "微软雅黑", sans-serif';
    ctx.fillStyle = '#88ff88';
    ctx.fillText('✓ 分数已保存', W / 2, 260);
  }

  ctx.font = 'bold 22px "微软雅黑", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(`🏆 排行榜 · ${modeLabel}`, W / 2, 320);

  ctx.font = '16px monospace';
  const startY = 355;
  const lineH = 22;
  const leftX = W / 2 - 140;
  const rightX = W / 2 + 140;
  const rows = Math.min(7, game.leaderboard.length);
  for (let i = 0; i < rows; i++) {
    const entry = game.leaderboard[i];
    const y = startY + i * lineH;
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
    ctx.fillStyle = i < 3 ? '#ffd966' : '#dddddd';
    ctx.textAlign = 'left';
    ctx.fillText(`${medal}  ${entry.name}`, leftX, y);
    ctx.textAlign = 'right';
    ctx.fillText(entry.score.toString(), rightX, y);
  }

  ctx.textAlign = 'center';
  ctx.font = 'bold 22px "微软雅黑", sans-serif';
  ctx.fillStyle = '#88ff88';
  ctx.fillText('按 空格键 返回模式选择', W / 2, H - 30);
}

function render() {
  ctx.save();
  if (game.shake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * game.shake,
      (Math.random() - 0.5) * game.shake
    );
  }
  game.shake *= 0.85;

  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, W, H);
  drawStars();

  if (game.state === STATE.START) {
    drawStartScreen();
  } else if (game.state === STATE.PLAYING) {
    drawPlanets();
    drawParticles();
    drawCat();
    drawHUD();
  } else if (game.state === STATE.OVER) {
    drawPlanets();
    drawParticles();
    drawCat();
    drawHUD();
    drawGameOverScreen();
  }

  ctx.restore();
}

let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000 || 0);
  lastTime = time;

  if (game.state === STATE.PLAYING) {
    updateCat(dt);
    updatePlanets();
    updateParticles();

    const d = difficulty();
    game.spawnTimer += dt;
    if (game.spawnTimer >= d.spawnInterval) {
      game.spawnTimer = 0;
      spawnPlanet();
    }

    game.watchdogTimer += dt;
    const watchdogInterval = game.mode === MODE.MATH ? 1.5 : 2.5;
    if (game.watchdogTimer >= watchdogInterval) {
      game.watchdogTimer = 0;
      ensureAnswerExists();
    }

    checkCollisions();
  } else {
    updateParticles();
  }

  render();
  requestAnimationFrame(loop);
}

audio.loadPref();
loadLeaderboard(game.selectedMode);
initStars();
requestAnimationFrame(loop);
</script>
